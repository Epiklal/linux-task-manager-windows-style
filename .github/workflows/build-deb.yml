# Builds the Debian package and attaches it to a GitHub release for a "v*" tag.
# Every push to main and every manual start also build and test, but only keep
# the package as a workflow artifact.
name: Build .deb

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: Build, test and publish
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
      MAINTAINER: "${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>"
    steps:
      - uses: actions/checkout@v4

      - name: Install lintian
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lintian

      - name: Build package
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ./build-deb.sh "${GITHUB_REF_NAME#v}"
          else
            ./build-deb.sh
          fi
          ls -l dist/
          dpkg-deb --info dist/*.deb

      # Like Linux Mint, ubuntu-latest has no PySide6 system packages: this also
      # tests the route through /opt/lintask/venv (download from PyPI).
      - name: Install package (smoke test)
        run: |
          sudo apt-get install -y ./dist/*.deb
          test -x /usr/bin/lintask
          test -f /usr/lib/systemd/system/lintask-server.service
          test -L /usr/bin/wintaskmanager

      - name: Start the application headless
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          lintask --server --help
          set +e
          timeout -s KILL 20 lintask
          rc=$?
          set -e
          # 137 = still running after 20 s (ended by timeout), anything else = crash
          test "$rc" -eq 137 || { echo "lintask exited with code $rc"; exit 1; }

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: /opt/lintask/venv/bin/python -m unittest discover -s tests -t .

      - name: Remove package again
        run: |
          sudo apt-get purge -y lintask
          test ! -e /opt/lintask
          test ! -e /usr/share/lintask

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lintask-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb \
              --title "Lintask $GITHUB_REF_NAME" --generate-notes
          fi
